[package]
name = "desktop-core"
version = "0.1.0"
license = "MIT"
description = "Muxflow's desktop backend, free of any UI toolkit"
edition.workspace = true
rust-version.workspace = true

[features]
# Compiles the perf_log measurement implementation into release builds for an
# A/B measurement campaign (`cargo build --release -p muxflow --features perf-log`).
# Debug builds always include it via debug_assertions; see src/perf_log.rs.
perf-log = []

[dependencies]
phase0-core = { path = "../phase0-core" }
base64 = "0.22"
blake3.workspace = true
clipboard-rs = { version = "0.3.5", features = ["wayland"] }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tmux-agent-protocol = { path = "../protocol" }
tmux-control = { path = "../tmux-control" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
uuid.workspace = true
ureq = "3"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = "0.9.3"
zbus = "5.19.0"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSBitmapImageRep", "NSImageRep", "NSPasteboard", "NSPasteboardItem", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSNotification", "NSObject", "NSOperation", "NSString", "NSURL", "block2"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
