[package]
name = "terminal-engine"
version = "0.1.0"
license = "MIT"
description = "Muxflow's terminal engine: one alacritty_terminal per pane and the hub that feeds it. No UI toolkit."
edition.workspace = true
rust-version.workspace = true

[dependencies]
alacritty_terminal = { version = "=0.26.0", default-features = false }
indexmap = "2"
serde.workspace = true
serde_json.workspace = true
unicode-segmentation = "1"

[dev-dependencies]
tmux-control = { path = "../tmux-control" }
