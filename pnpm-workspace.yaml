packages:
  - apps/desktop

allowBuilds:
  esbuild: true

# Upstream bug in @xterm/addon-webgl 0.19.0 only: TextureAtlas sets
# `_requestClearModel` true on an atlas page merge or the first oversized glyph
# and never resets it, so from that frame on WebglRenderer.renderRows clears and
# rebuilds the *whole* viewport model every frame for the rest of the session —
# the garbled rows and stutter while scrolling a busy pane. The patch makes
# `TextureAtlas.beginFrame()` consume the flag, so exactly one frame rebuilds
# per merge event. Drop it if a later addon release fixes this upstream.
#
# Upstream in @xterm/xterm 6.0.0: the wheel path that feeds full-screen TUIs
# multiplies every sub-50px delta by 0.3 and then emits at most one report per
# DOM wheel event, whatever the delta was worth — a TUI scrolls at a fraction of
# the speed of the shell in the pane beside it, which reads as a wrong scroll
# speed setting rather than as lag. The patch drops the 0.3, honours the whole-row
# count (bounded to 5 rows per DOM event), and repeats the encoded report inside
# the single existing data event so N rows still cost one input round trip.
# Drop it if a later xterm release fixes this upstream.
patchedDependencies:
  '@xterm/addon-webgl@0.19.0': patches/@xterm__addon-webgl@0.19.0.patch
  '@xterm/xterm@6.0.0': patches/@xterm__xterm@6.0.0.patch
