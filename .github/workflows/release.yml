# Turns a pushed version tag into signed, verified artifacts in a DRAFT GitHub
# Release. Nothing is public until a maintainer reviews the draft and presses
# Publish; only then does releases/latest/download/latest.json (the manifest the
# apps poll for updates) point at the new version.
#
#   release/set-version.sh 0.2.0   # merged to main through a pull request
#   git tag v0.2.0 && git push origin v0.2.0
#
# A tag with a suffix (v0.2.0-rc.1) builds from a tree still versioned 0.2.0
# and is drafted as a pre-release, which releases/latest never selects.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # vite's production build of the desktop (Monaco included) can exceed
  # Node's default heap on the 7 GB macOS runners.
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          tag=${GITHUB_REF_NAME#v}
          version=${tag%%-*}
          release/check-version.sh "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then echo prerelease=true; else echo prerelease=false; fi >> "$GITHUB_OUTPUT"

  linux:
    needs: [ci, version]
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the release build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: rustup show active-toolchain || rustup toolchain install
      - run: pnpm install --frozen-lockfile
      - name: Build and verify the package
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          release/linux/build-package.sh ${{ matrix.arch }}
          release/linux/verify-package.sh "tmp/release/muxflow-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: tmp/release/muxflow-*-linux-${{ matrix.arch }}.tar.gz*
          if-no-files-found: error

  # Each architecture's package also carries the other architecture's helper,
  # so a desktop can install onto a remote host of either kind.
  linux-universal:
    needs: [version, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-{x86_64,aarch64}
          path: tmp/release
          merge-multiple: true
      - name: Add the cross-architecture helpers
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          x86=tmp/release/muxflow-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
          arm=tmp/release/muxflow-${{ needs.version.outputs.version }}-linux-aarch64.tar.gz
          # Each call reads the other archive's native helper, so both read the
          # original archives before either is rewritten.
          cp "$x86" tmp/x86-original.tar.gz
          cp "$arm" tmp/arm-original.tar.gz
          release/linux/add-cross-helper.sh "$x86" tmp/arm-original.tar.gz
          release/linux/add-cross-helper.sh "$arm" tmp/x86-original.tar.gz
          release/linux/verify-package.sh "$x86"
          release/linux/verify-package.sh "$arm"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-universal
          path: tmp/release/muxflow-*-linux-*.tar.gz*
          if-no-files-found: error

  macos:
    needs: [version, linux]
    runs-on: macos-15
    environment: release
    timeout-minutes: 120
    env:
      MUXFLOW_MACOS_SIGNING_IDENTITY: ${{ secrets.MUXFLOW_MACOS_SIGNING_IDENTITY }}
      MUXFLOW_APPLE_TEAM_ID: ${{ secrets.MUXFLOW_APPLE_TEAM_ID }}
      MUXFLOW_NOTARY_KEY_ID: ${{ secrets.MUXFLOW_NOTARY_KEY_ID }}
      MUXFLOW_NOTARY_ISSUER: ${{ secrets.MUXFLOW_NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: rustup show active-toolchain || rustup toolchain install
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-{x86_64,aarch64}
          path: ${{ runner.temp }}/linux
          merge-multiple: true
      - name: Take the Linux helpers from the verified packages
        run: |
          helpers=$RUNNER_TEMP/linux-helpers
          mkdir -p "$helpers"
          for arch in x86_64 aarch64; do
            package=muxflow-${{ needs.version.outputs.version }}-linux-$arch
            tar -xzf "$RUNNER_TEMP/linux/$package.tar.gz" -O "$package/bin/muxflow-host" > "$helpers/muxflow-host-linux-$arch"
          done
          echo "MUXFLOW_LINUX_HELPERS_DIR=$helpers" >> "$GITHUB_ENV"
      - name: Install the signing certificate and notary key
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MUXFLOW_MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MUXFLOW_MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.MUXFLOW_NOTARY_KEY_P8_BASE64 }}
        run: |
          keychain=$RUNNER_TEMP/signing.keychain-db
          keychain_password=$(openssl rand -base64 32)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "MUXFLOW_NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - name: Build, sign, notarize and verify
        run: release/macos/build-package.sh
      - name: Collect the DMG
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp "tmp/work/cache/release-target/macos/release/bundle/dmg/Muxflow_${{ needs.version.outputs.version }}_aarch64.dmg" "$RUNNER_TEMP/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ${{ runner.temp }}/out/*.dmg
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/certificate.p12"

  android:
    needs: [ci, version]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and verify the release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.MUXFLOW_ANDROID_KEYSTORE_BASE64 }}
          MUXFLOW_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MUXFLOW_ANDROID_KEYSTORE_PASSWORD }}
          MUXFLOW_ANDROID_KEY_ALIAS: ${{ secrets.MUXFLOW_ANDROID_KEY_ALIAS }}
          MUXFLOW_ANDROID_KEY_PASSWORD: ${{ secrets.MUXFLOW_ANDROID_KEY_PASSWORD }}
        run: |
          export MUXFLOW_ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$MUXFLOW_ANDROID_KEYSTORE"
          export MUXFLOW_JAVA_HOME=$JAVA_HOME MUXFLOW_ANDROID_HOME=$ANDROID_HOME
          pnpm mobile:apk:release
          rm -f "$MUXFLOW_ANDROID_KEYSTORE"
          mkdir -p "$RUNNER_TEMP/out"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/out/muxflow-${{ needs.version.outputs.version }}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/out/*.apk
          if-no-files-found: error

  publish:
    needs: [version, linux-universal, macos, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts
      - name: Assemble the release files
        run: |
          version=${{ needs.version.outputs.version }}
          out=$RUNNER_TEMP/release
          mkdir -p "$out"
          cp "$RUNNER_TEMP"/artifacts/linux-universal/muxflow-"$version"-linux-*.tar.gz "$out/"
          cp "$RUNNER_TEMP"/artifacts/macos/Muxflow_"$version"_aarch64.dmg "$out/"
          cp "$RUNNER_TEMP"/artifacts/android/muxflow-"$version"-android.apk "$out/"
          (cd "$out" && sha256sum -- * > SHA256SUMS)
          node -e 'process.stdout.write(JSON.stringify({version: process.argv[1], url: process.argv[2]}, null, 2) + "\n")' \
            "$version" "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" > "$out/latest.json"
          cat "$out/SHA256SUMS" "$out/latest.json"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--draft --verify-tag --generate-notes --title "Muxflow ${GITHUB_REF_NAME#v}")
          [[ "${{ needs.version.outputs.prerelease }}" != true ]] || flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" "$RUNNER_TEMP"/release/*
