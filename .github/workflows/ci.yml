name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v6
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev tmux
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:privacy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
      - run: cargo test --workspace --all-targets
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
      - name: Test voice sidecar contracts
        run: uv run --python 3.12 --no-project --no-config python -m unittest apps/host/src/service/voice/test_sidecar.py
      - name: Smoke-test the pinned voice runtime
        run: >-
          uv run --python 3.12 --no-project --no-config
          --with transcribe-cpp==0.2.3
          python -c "import transcribe_cpp; assert transcribe_cpp.native_version() == '0.2.3'"
      - name: Check public protocol driver
        if: runner.os == 'Linux'
        run: |
          cargo fmt --manifest-path tests/integration/protocol/protocol-driver/Cargo.toml -- --check
          cargo check --manifest-path tests/integration/protocol/protocol-driver/Cargo.toml
      - name: Run bounded tmux control parser fuzz smoke
        if: runner.os == 'Linux'
        run: cargo run --manifest-path tests/integration/fuzz-smoke/Cargo.toml -- 1000
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Check mobile skeleton
        if: runner.os == 'Linux'
        run: |
          pnpm mobile:check
          pnpm mobile:test
          pnpm --filter @muxflow/mobile protocol:check
      - name: Build and verify macOS package smoke
        if: runner.os == 'macOS'
        env:
          ADE_MACOS_PACKAGE_SMOKE: '1'
        run: release/macos/build-package.sh
      - name: Test application shell contracts
        if: runner.os == 'Linux'
        run: pnpm test:shell
      - name: Test SSH transport against delayed Docker target
        if: runner.os == 'Linux'
        run: pnpm test:transport:ssh
      - name: Test daemon and protocol lifecycle
        if: runner.os == 'Linux'
        run: pnpm test:lifecycle
      - name: Test protocol backend against local and delayed Docker SSH tmux
        if: runner.os == 'Linux'
        run: pnpm test:protocol
      - name: Test file services against local and delayed Docker SSH tmux
        if: runner.os == 'Linux'
        run: pnpm test:files
      - name: Test Git backend contracts
        if: runner.os == 'Linux'
        run: pnpm test:git
      - name: Test agent backend contracts
        if: runner.os == 'Linux'
        run: pnpm test:agents
      - name: Test deterministic transfer contracts
        if: runner.os == 'Linux'
        run: pnpm test:transfers
      - name: Test production transfer paths with bounded payloads
        if: runner.os == 'Linux'
        run: pnpm test:transfers:smoke
      - name: Check release driver
        if: runner.os == 'Linux'
        run: |
          cargo fmt --manifest-path tests/release/protocol-driver/Cargo.toml -- --check
          cargo clippy --manifest-path tests/release/protocol-driver/Cargo.toml -- -D warnings
          cargo test --manifest-path tests/release/protocol-driver/Cargo.toml
      - name: Test diagnostics and security contracts
        if: runner.os == 'Linux'
        run: bash tests/release/run-fault-security.sh
      - name: Reproduce, install, upgrade, and uninstall Linux package
        if: runner.os == 'Linux'
        run: pnpm test:package
