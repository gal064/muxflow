name: linux-release-hardening

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

jobs:
  shaped-linux-release-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install Linux transfer prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev tmux docker.io jq
      - run: pnpm install --frozen-lockfile
      - name: Scale, fault, package, and transfer matrix
        run: pnpm test:release:matrix
      - name: Publish verified x86-64 staging package
        run: |
          mkdir -p tmp/release
          package_run=$(realpath tmp/phase8-package-latest)
          cp "$package_run"/output-a/*.tar.gz "$package_run"/output-a/*.sha256 tmp/release/
          release/linux/verify-package.sh tmp/release/*-linux-x86_64.tar.gz
      - name: Upload x86-64 staging package and evidence
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86-64-staging
          path: |
            tmp/phase8-*-latest
            tmp/evidence/**
            tmp/release/*.tar.gz
            tmp/release/*.sha256
          if-no-files-found: error

  native-arm64-package:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install Linux desktop prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev tmux jq
      - run: pnpm install --frozen-lockfile
      - name: Build and compare two clean native ARM64 packages
        run: ADE_PHASE8_PACKAGE_ARCH=aarch64 tests/release/run-package.sh
      - name: Publish verified ARM64 staging package
        run: |
          mkdir -p tmp/release
          package_run=$(realpath tmp/phase8-package-latest)
          cp "$package_run"/output-a/*.tar.gz "$package_run"/output-a/*.sha256 tmp/release/
          release/linux/verify-package.sh tmp/release/*-linux-aarch64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-staging
          path: |
            tmp/release/*.tar.gz
            tmp/release/*.sha256
          if-no-files-found: error

  universal-linux-packages:
    needs: [shaped-linux-release-matrix, native-arm64-package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86-64-staging
          path: tmp/staging/x86
      - uses: actions/download-artifact@v4
        with:
          name: linux-arm64-staging
          path: tmp/staging/arm
      - name: Add verified cross-architecture remote helpers
        run: |
          x86=$(find tmp/staging/x86 -name '*-linux-x86_64.tar.gz' -print -quit)
          arm=$(find tmp/staging/arm -name '*-linux-aarch64.tar.gz' -print -quit)
          release/linux/add-cross-helper.sh "$x86" "$arm"
          release/linux/add-cross-helper.sh "$arm" "$x86"
          mkdir -p tmp/release
          cp "$x86" "$x86.sha256" "$arm" "$arm.sha256" tmp/release/
          release/linux/verify-package.sh tmp/release/*-linux-x86_64.tar.gz
          release/linux/verify-package.sh tmp/release/*-linux-aarch64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: linux-universal-release-packages
          path: |
            tmp/release/*.tar.gz
            tmp/release/*.sha256
          if-no-files-found: error
