name: linux-release-heavy

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

jobs:
  exact-transfer-and-release-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install Linux desktop prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev tmux
      - run: pnpm install --frozen-lockfile
      - name: Exact Linux release matrix (manual/nightly only)
        run: pnpm test:release:heavy
      - name: Retain compact release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-heavy-evidence-${{ github.run_id }}
          path: tmp/evidence
          if-no-files-found: error
          retention-days: 14
