<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Muxflow terminal</title>
<style>
  /*__FONT_FACE__*/
  /* The palette of the colors the host reports to programs (terminalScheme.ts);
     `data-scheme` is set on <html> before the first paint and by `theme`. */
  :root {
    --page-bg: #282c34;
    --handle-fill: #7aa6da;
    --copy-bg: #2c313a;
    --copy-border: #3e4451;
    --copy-ink: #fff;
    --copy-pressed: #353b45;
  }
  :root[data-scheme="light"] {
    --page-bg: #fcfcfc;
    --handle-fill: #2f6fe0;
    --copy-bg: #ffffff;
    --copy-border: #d4d4d8;
    --copy-ink: #27272a;
    --copy-pressed: #ececee;
  }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--page-bg); }
  /* A 6 px inset so column 0 does not touch the bezel; the fit addon measures the inner box. */
  #terminal { position: absolute; inset: 0 0 0 6px; }
  .xterm .xterm-viewport { overflow-y: auto; }
  .muxflow-selection-control { display: none; position: absolute; z-index: 20; }
  .muxflow-selection-control.visible { display: block; }
  .muxflow-selection-handle {
    appearance: none;
    background: transparent;
    border: 0;
    height: 44px;
    margin: 0;
    padding: 0;
    touch-action: none;
    width: 44px;
  }
  .muxflow-selection-handle::before {
    background: var(--handle-fill);
    border: 2px solid var(--page-bg);
    border-radius: 50%;
    box-sizing: border-box;
    content: "";
    height: 18px;
    left: 13px;
    position: absolute;
    top: 13px;
    width: 18px;
  }
  .muxflow-copy-button {
    appearance: none;
    background: var(--copy-bg);
    border: 1px solid var(--copy-border);
    border-radius: 8px;
    color: var(--copy-ink);
    font: 600 14px Roboto, system-ui, sans-serif;
    min-height: 44px;
    min-width: 60px;
    padding: 7px 12px;
    touch-action: manipulation;
  }
  .muxflow-copy-button:active { background: var(--copy-pressed); }
  /*__XTERM_CSS__*/
</style>
</head>
<body>
<div id="terminal"></div>
<script>/*__BUNDLE__*/</script>
</body>
</html>
