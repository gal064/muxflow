[package]
name = "muxflow-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
# Compiles the switch-timing instrumentation (`timing.log`) into a release
# helper for a measurement campaign:
# `cargo build --locked --release -p muxflow-host --features perf-log`.
# Debug builds always include it via debug_assertions; see the compile-out note
# in src/diagnostics.rs. A shipped release helper writes no timing log.
perf-log = []

[dependencies]
anyhow.workspace = true
blake3.workspace = true
libc.workspace = true
notify.workspace = true
phase0-core = { path = "../../crates/phase0-core" }
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tmux-agent-protocol = { path = "../../crates/protocol" }
tmux-control = { path = "../../crates/tmux-control" }
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
