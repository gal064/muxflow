[package]
name = "tmux-agent-desktop"
version = "0.1.0"
description = "A graphical IDE on top of tmux"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "tmux_agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
phase0-core = { path = "../../../crates/phase0-core" }
blake3.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri = { version = "2.11.5", features = [] }
tmux-agent-protocol = { path = "../../../crates/protocol" }
tmux-control = { path = "../../../crates/tmux-control" }
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
clipboard-rs = "0.3.5"
zbus = "5.19.0"
