[package]
name = "muxflow"
version = "0.1.32"
license = "MIT"
description = "A graphical IDE on top of tmux"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "muxflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Compiles the perf_log measurement implementation into release builds for an
# A/B measurement campaign (`cargo build --release --features perf-log`).
# Debug builds always include it via debug_assertions; see
# crates/desktop-core/src/perf_log.rs.
perf-log = ["desktop-core/perf-log"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
desktop-core = { path = "../../../crates/desktop-core" }
phase0-core = { path = "../../../crates/phase0-core" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"

[dev-dependencies]
tauri = { version = "2.11.5", features = ["test"] }

[target.'cfg(target_os = "macos")'.dependencies]
tokio = { version = "1", features = ["sync"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSResponder", "NSWindow"] }
