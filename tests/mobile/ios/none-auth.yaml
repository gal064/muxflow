appId: dev.muxflow.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      notifications: allow
# A cold first launch on a busy simulator can outlast a plain assertion.
- extendedWaitUntil:
    visible: No hosts yet
    timeout: 60000
- tapOn: Your SSH key
- assertVisible: This phone has no SSH key.*
- assertNotVisible: This phone's SSH key could not be read.
- takeScreenshot: no-phone-key
- tapOn:
    id: BackButton
- runFlow: setup-host.yaml
- runFlow: files-and-resume.yaml
