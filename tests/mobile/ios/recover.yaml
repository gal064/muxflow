appId: dev.muxflow.mobile
---
- extendedWaitUntil:
    visible:
      text: Send
      enabled: true
    timeout: 30000
- runFlow:
    file: send-terminal.yaml
    env:
      COMMAND: "printf 'recovered\\n' > ios-recovered.marker"
      EXPECTED: '.*ios-recovered\.marker.*'
- takeScreenshot: recovered
