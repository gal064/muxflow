appId: dev.muxflow.mobile
---
# TEMPORARY (feat/quick-session-shortcuts-xcode27 QA): screenshots of the main
# screens on the Xcode 27 / Expo 58 build. Remove before merge. Every step is
# optional so it never fails the run; the screenshots are the evidence.
- launchApp:
    stopApp: false
- waitForAnimationToEnd
- takeScreenshot: walk-01-current
- tapOn:
    text: '^Agents.*'
    optional: true
- waitForAnimationToEnd
- takeScreenshot: walk-02-agents
- tapOn:
    text: '^Workspaces.*'
    optional: true
- waitForAnimationToEnd
- takeScreenshot: walk-03-workspaces
- tapOn:
    id: quick-new-agent
    optional: true
- waitForAnimationToEnd
- takeScreenshot: walk-04-new-agent-without-command
- tapOn:
    text: Settings
    optional: true
- waitForAnimationToEnd
- takeScreenshot: walk-05-settings
- tapOn:
    id: settings-default-directory
    optional: true
- inputText:
    text: projects
    optional: true
- hideKeyboard:
    optional: true
- takeScreenshot: walk-06-relative-directory
- scroll
- takeScreenshot: walk-07-settings-scrolled
- tapOn:
    id: BackButton
    optional: true
- tapOn:
    text: History
    optional: true
- waitForAnimationToEnd
- takeScreenshot: walk-08-history
- tapOn:
    id: BackButton
    optional: true
- tapOn:
    text: '^random,.*'
    optional: true
- waitForAnimationToEnd
- takeScreenshot: walk-09-random-workspace
- tapOn:
    id: quick-new-terminal
    optional: true
- extendedWaitUntil:
    visible:
      text: Esc
      enabled: true
    timeout: 30000
    optional: true
- takeScreenshot: walk-10-terminal
- tapOn:
    text: Esc
    optional: true
- takeScreenshot: walk-11-terminal-keyboard
