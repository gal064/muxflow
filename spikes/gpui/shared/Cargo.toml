[package]
name = "spike-shared"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
gpui-kit.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "spike-shared"
path = "src/main.rs"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
gpui-platform = { package = "gpui-pre-platform", version = "0.3.11", features = ["test-support"] }

# S7: renders through GPUI's real offscreen renderer, so it needs a Vulkan
# driver (lavapipe in CI) but no display server. Not a libtest harness, as in
# gpui-kit's own tests/rendering.rs.
[[test]]
name = "headless"
path = "tests/headless.rs"
harness = false
