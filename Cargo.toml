[workspace]
members = [
  "apps/desktop/src-tauri",
  "apps/desktop-gpui",
  "apps/host",
  "crates/desktop-core",
  "crates/protocol",
  "crates/terminal-interactions",
  "crates/tmux-control",
  "crates/phase0-core",
  "crates/terminal-engine",
]
# Vendored crates keep their own upstream formatting and are not linted here.
exclude = ["vendor/gpui-pre-macos"]
resolver = "2"

# GPUI's macOS backend at gpui-kit's pin (gpui-pre-macos 0.3.11, and still in
# 0.3.12) calls `Option::map_or_default`, which Rust 1.97.1 stable does not
# have. Remove when a released gpui-pre-macos builds on stable. See
# vendor/gpui-pre-macos/VENDORED.md.
[patch.crates-io]
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }

[workspace.package]
edition = "2024"
rust-version = "1.97.1"

# A development build runs the same control parser, protocol codec and hashing
# as a release build, and at opt-level 0 those are slow enough to be mistaken
# for product latency — every measurement taken against `tauri dev` was really
# measuring the compiler. Level 1 on our own crates keeps builds quick and
# debugging usable; dependencies are compiled once, so they get full
# optimisation.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
anyhow = "1"
bytes = "1"
blake3 = "1"
libc = "0.2"
notify = "8"
prost = "0.14"
rubato = "0.16.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
